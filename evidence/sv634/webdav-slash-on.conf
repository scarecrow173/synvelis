# synvelis#634 — stock mod_dir 検証用 vhost（補助証拠）。
# docker/webdav/conf/webdav.conf の `DirectorySlash Off` workaround を
# 外した版。`DirectorySlash On`（Apache 既定）により、slashless
# collection への PROPFIND は mod_dir が canonical 形への 301
# （/library → Location: /library/）を返す。本 Issue の provider 修正が
# 実サーバの slash redirect を正しく follow できるかを検証するために
# docker-compose.webdav.override.yml 経由で bind mount する。
# tracked な docker/ 配下のファイルは変更しない。
#
# 使い方（repo ルートから）:
#   docker compose -f docker-compose.webdav.yml \
#     -f evidence/sv634/docker-compose.webdav.override.yml \
#     --env-file docker/.env up -d --build

Listen 443

<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /certs/server.crt
    SSLCertificateKeyFile /certs/server.key

    DocumentRoot /var/dav
    DavLockDB /var/dav-lock/DavLock

    <Directory /var/dav>
        DAV On
        Options Indexes
        AllowOverride None

        # synvelis#634: stock mod_dir の既定動作。slashless
        # collection request へ canonical 形（trailing slash 付き）
        # への 301 を返す — provider は Location の綴りを
        # wire path として follow しなければならない。
        DirectorySlash On

        AuthType Basic
        AuthName "synvelis-webdav"
        AuthUserFile /certs/htpasswd
        Require valid-user
    </Directory>
</VirtualHost>
