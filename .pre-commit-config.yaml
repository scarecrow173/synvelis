# Lightweight, staged-file formatting, syntax and safety checks via prek.
# Rust package verification uses mise tasks; workspace/OS verification stays in Full CI.
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        exclude: '\.(ps1|bat|cmd)$'
      - id: fix-byte-order-marker
        exclude: '\.ps1$'
      - id: detect-private-key
      - id: check-illegal-windows-names

  - repo: local
    hooks:
      # Only staged GitHub Actions workflow files: no workspace-wide scan on commit.
      # The Full CI's prek --all-files run covers all workflows.
      - id: actionlint
        name: actionlint (changed workflows)
        entry: mise exec -- actionlint
        language: system
        files: '^\.github/workflows/.*\.(yml|yaml)

        pass_filenames: true
