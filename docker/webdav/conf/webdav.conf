# synvelis#633 WebDAV 検証用 vhost。
# /var/dav（docker/webdav/data を read-only bind）を DAV On で公開し、
# Basic 認証と throwaway 私有 CA のサーバ証明書で TLS を張る。
#
# fault matrix 実走対象契約（docs/specs/alib-07-webdav-docker-provider.md 参照）:
#   - PROPFIND Depth:0/1 → 207 multistatus（getetag 等の liveprop を含む）
#   - GET → strong ETag（FileETag 既定 INode+MTime+Size）
#   - If-Match conditional GET → 不一致時 412
#   - Range → 206 + Content-Range

Listen 443

<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /certs/server.crt
    SSLCertificateKeyFile /certs/server.key

    DocumentRoot /var/dav
    DavLockDB /var/dav-lock/DavLock

    <Directory /var/dav>
        DAV On
        Options Indexes
        AllowOverride None

        # synvelis#633 計測上の注意:
        # WebDavProvider は collection を trailing slash なしの
        # canonical path（/library）で PROPFIND する。mod_dir は
        # trailing slash への 301 を返すが、provider 側の redirect
        # 解決が path を再正規化して slash を落とすため ping-pong
        # する（provider 側の課題 — scarecrow173/synvelis#634）。
        # 実 server 環境として検証を回すため、mod_dir の slash
        # redirect を Off にして slashless PROPFIND を直接応答させる。
        DirectorySlash Off

        AuthType Basic
        AuthName "synvelis-webdav"
        AuthUserFile /certs/htpasswd
        Require valid-user
    </Directory>
</VirtualHost>
