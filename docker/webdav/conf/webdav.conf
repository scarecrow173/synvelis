# synvelis#633 WebDAV 検証用 vhost。
# /var/dav（docker/webdav/data を read-only bind）を DAV On で公開し、
# Basic 認証と throwaway 私有 CA のサーバ証明書で TLS を張る。
#
# fault matrix 実走対象契約（docs/specs/alib-07-webdav-docker-provider.md 参照）:
#   - PROPFIND Depth:0/1 → 207 multistatus（getetag 等の liveprop を含む）
#   - GET → strong ETag（FileETag 既定 INode+MTime+Size）
#   - If-Match conditional GET → 不一致時 412
#   - Range → 206 + Content-Range

Listen 443

<VirtualHost *:443>
    ServerName localhost
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /certs/server.crt
    SSLCertificateKeyFile /certs/server.key

    DocumentRoot /var/dav
    DavLockDB /var/dav-lock/DavLock

    <Directory /var/dav>
        DAV On
        Options Indexes
        AllowOverride None

        AuthType Basic
        AuthName "synvelis-webdav"
        AuthUserFile /certs/htpasswd
        Require valid-user
    </Directory>
</VirtualHost>
