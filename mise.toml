[settings]
minimum_release_age = "7d"
lockfile = true

[env]
UV_EXCLUDE_NEWER = "1 week"

# Infrastructure tools only; add a project language toolchain as needed.
[tools]
actionlint = "1.7.12"
uv = "0.13.4"
prek = "0.5.5"
git-lfs = "3.8.0"
"github:microsoft/apm" = "0.33.0"
"pipx:serena-agent" = "1.7.0"
# Rust toolchain はここでは pin しない。通常開発は環境導入済みの
# rust(rustup / global mise)を使い、CI 用の pin は mise.ci.toml
# (MISE_ENV=ci で有効化)に分離する。
node = "26.12.1"

[tasks.setup]
description = "Install APM dependencies, prek hooks and repository-local Git LFS"
run = [
  "apm install",
  "prek install",
  "git lfs install --local",
]

[tasks.fmt]
description = "Format all Rust sources"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting without rewriting"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Verify one Cargo package: mise run check <package> [cargo flags] (required package)"
raw_args = true
run = "cargo check --locked --all-targets -p"

[tasks.lint]
description = "Lint one Cargo package with warnings denied: mise run lint <package> [cargo flags]"
raw_args = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "$#" -lt 1 ]; then
  echo "usage: mise run lint <package> [cargo flags]" >&2
  exit 2
fi
cargo clippy --locked --all-targets -p "$@" -- -D warnings
'''

[tasks.test]
description = "Verify one Cargo package: mise run test <package> [cargo flags] (required package)"
raw_args = true
run = "cargo test --locked -p"

[tasks.test-rt]
description = "Run the rt_ contract tests (RT no-alloc/no-block) against the locked dependency graph"
run = "cargo test --workspace --locked rt_"

# TIM-03 (#127): Synvelis-owned test-only L1 runner を先に build し、
# その artifact path を production composition seam 経由の L1 oracle が
# target profile root から再現可能に解決する。dedicated task は runner と
# fixture cdylib の両方を同一 locked graph で build する入口。
[tasks.test-tim03-l1]
description = "Build the test-only TIM-03 L1 runners and run the synvelis-app L1 process oracle"
run = "cargo build --locked -p synvelis-plugin-test-l1-runner && cargo test --locked -p synvelis-app --test tim03_l1_process_oracle -- --ignored --test-threads=1 --nocapture"

[tasks.test-pc-c4-l1]
description = "Build the test-only L1 runners and run the PC-C4 real ABI binding tests"
run = "cargo build --locked -p synvelis-plugin-test-l1-runner && cargo test --locked -p synvelis-app --test pc_c4_l1_real_abi_binding -- --ignored --test-threads=1 --nocapture"

# TIM-03 (#127) transport application slice: production composition に
# BoundaryDeclaration を供給し、tempo/loop/seek/automation を実 L1
# fixture 上で観測する dedicated lane。runner は test-only で、
# fixture artifact resolution contract は test-tim03-l1 / test-pc-c4-l1 と同じ。
[tasks.test-tim03-transport]
description = "Build the test-only TIM-03 L1 runners and run the transport application tests"
run = "cargo build --locked -p synvelis-plugin-test-l1-runner && cargo test --locked -p synvelis-app --test tim03_l1_transport_application -- --ignored --test-threads=1 --nocapture"

# TIM-03 (#127) instrument transport oracle slice: direct L1 endpoint に
# caller supplied TransportInfo を供給し、ruviform#630 test_instrument の
# plugin-side musical click law を independent PCM oracle で検証する。
# production graph end-to-end musical handoff は upstream gap のため対象外。
[tasks.test-tim03-instrument-transport]
description = "Build the test-only TIM-03 L1 runners and run the instrument transport oracle"
run = "cargo build --locked -p synvelis-plugin-test-l1-runner && cargo test --locked -p synvelis-app --test tim03_l1_instrument_transport -- --ignored --test-threads=1 --nocapture"

# TIM-03 (#127) production musical transport slice: production composition
# → PluginNode → real ABI test_instrument を project-owned tempo map/PPQNで
# 検証する dedicated lane。direct endpoint API は使わない。
[tasks.test-tim03-production-transport]
description = "Build the test-only TIM-03 L1 runners and run the production musical transport tests"
run = "cargo build --locked -p synvelis-plugin-test-l1-runner && cargo test --locked -p synvelis-app --test tim03_l1_production_musical_transport -- --ignored --test-threads=1 --nocapture"

# TIM-03 (#127) representative dynamic musical transport refresh slice:
# 同一 production oracle binary が baseline production evidence と dynamic
# tempo-edit evidenceをVST3/CLAP両formatでfail-closedに出力する。
# direct endpoint API は使わない。
[tasks.test-tim03-dynamic-musical-transport]
description = "Build the test-only TIM-03 L1 runners and run the dynamic musical transport tests"
run = "cargo build --locked -p synvelis-plugin-test-l1-runner && cargo test --locked -p synvelis-app --test tim03_l1_production_musical_transport -- --ignored --test-threads=1 --nocapture"

# TIM-03 (#127) frame/boundary/event-order matrix slice: headless exact
# matrix oracleと production composition → PluginNode → real ABI
# test_instrument matrixを一つの入口に束ねる。fake-only を production
# ABI Pass に昇格しない。
[tasks.test-tim03-frame-boundary-matrix]
description = "Build the TIM-03 L1 runners and run the frame/boundary matrix tests"
run = "cargo build --locked -p synvelis-plugin-test-l1-runner && cargo test --locked -p synvelis-player --test tim03_process_boundary --test tim03_request_plan --test tim03_loop_boundary --test tim03_driver_loop_boundary -- --test-threads=1 --nocapture && cargo test --locked -p synvelis-app --test tim03_l1_frame_boundary_matrix -- --ignored --test-threads=1 --nocapture"

# RCD-01 opt-in 実機 lane（CI 対象外・hardware 依存）。
# real-device feature で ruviform-audio-device/cpal を有効化し、
# tests/real_input.rs の #[ignore] test のみを実行する。
# device 不在環境では test 内の loud SKIP で終了する。
[tasks.test-recording-real-input]
description = "Run the opt-in real audio device lane for synvelis-recording (requires hardware; not in CI)"
run = "cargo test -p synvelis-recording --locked --features real-device --test real_input -- --ignored --test-threads=1"

# real-device feature 有効時の compile/lint を headless で検証する
# 補助 lane（cpal/OS audio 依存の build を要求するため opt-in）。
[tasks.lint-recording-real-input]
description = "Clippy for synvelis-recording with the real-device feature enabled (opt-in; not in CI)"
run = "cargo clippy -p synvelis-recording --all-targets --locked --features real-device -- -D warnings"

# RCD-01 consumer virtual-WASAPI EXT-L3 lane（CI 対象外・endpoint provisioning 依存）。
# Ruviform Cable Input/Output pair 不在環境では test 内で RunMetadata
# `result=not-run` / `NOT_PROVISIONED` を出して exit 0 になる。
[tasks.test-recording-virtual-endpoint]
description = "Run the opt-in Ruviform virtual endpoint EXT-L3 lane for synvelis-recording (requires provisioned endpoints for Pass; not in CI)"
run = "cargo test -p synvelis-recording --locked --features real-device --test virtual_endpoint -- --ignored --test-threads=1 --nocapture"

# RCD-02 opt-in real-FS lane（CI 対象外・実 FS 実測）。
# recording-poc tests/real_fs_probe.rs の #[ignore] test のみを実行し、
# 実 FS 上の rename 原子性・dir sync capability・unsynced tail の
# 実挙動を観測する。真の power-loss は非破壊的に自動化できないため
# NotRun のまま残し、process kill で代替可能な範囲のみ実測する。
[tasks.test-recording-real-fs]
description = "Run the opt-in real-FS durability probe for RCD-02 (real FS; not in CI)"
run = "cargo test -p recording-poc --locked --test real_fs_probe -- --ignored --test-threads=1"

# SYN-IO-02 / synvelis#84 opt-in real-FS lane（CI 対象外・実 FS 実測）。
# synvelis-project tests/real_fs_probe.rs の #[ignore] test のみを実行し、
# 実 Windows FS 上の Snapshot CreateNew→HEAD CAS publish を実 OS
# process kill で中断して reopen/Recovery を検証する。真の
# power-loss・Indeterminate誘発は非破壊的に自動化不能のため
# NotRun のまま残す。bundle volume は SYNVELIS_REALFS_ROOT で
# 固定可能（既定 temp dir）。
[tasks.test-project-real-fs]
description = "Run the opt-in real-FS crash/recovery lane for SYN-IO-02 (real FS; not in CI)"
# --nocapture: CASE=SV84-REAL-* の観測行を証拠転記用に stdout へ出す。
run = "cargo test -p synvelis-project --locked --test real_fs_probe -- --ignored --test-threads=1 --nocapture"

[tasks.lint-actions]
description = "Lint GitHub Actions workflow files with actionlint"
run = "actionlint"

# Issue #166 stage 1: Full CI 化。変更影響分類・選択実行は撤去し、全 lane
# を毎回実行する。jobs API 実結果の fail-closed 照合は tools/ci-summary.mjs
# が単一の authoritative 実装として所有する(pr=evidence 互換 gate、
# full=ci-summary — mode は CI_SUMMARY_MODE で渡す)。
[tasks.ci-summary-gate]
description = "run 内の全 lane leg を fail-closed 照合する CI 集約 gate (CI_SUMMARY_MODE=pr|full)"
run = "node tools/ci-summary.mjs gate"

[tasks.test-ci-summary]
description = "ci-summary gate の node:test スイート"
run = "node --test tools/ci-summary.test.mjs"

# Issue #167: consumer 側 reconcile 入口契約(共有 pin 単一性・mode 分離・
# guard・入口 trigger・既存入口不変)を静的に pin する。
[tasks.test-ci-tracker-entry]
description = "ci-issue-tracker reconcile 入口の consumer 契約 node:test スイート"
run = "node --test tools/ci-issue-tracker-reconcile.test.mjs"

[tasks.build]
description = "Verify one Cargo package: mise run build <package> [cargo flags] (required package)"
raw_args = true
run = "cargo build --locked -p"

# AUTX-03 (#262): synvelis-cli headless crate dedicated lanes.
[tasks.check-cli]
description = "Headless CLI crate check: cargo check -p synvelis-cli --locked --all-targets"
run = "cargo check --locked --all-targets -p synvelis-cli"

[tasks.lint-cli]
description = "Headless CLI crate lint (warnings denied): cargo clippy -p synvelis-cli --all-targets --locked -- -D warnings"
run = "cargo clippy --locked --all-targets -p synvelis-cli -- -D warnings"

[tasks.test-cli]
description = "Headless CLI crate tests incl. real-binary e2e: cargo test -p synvelis-cli --locked"
run = "cargo test --locked -p synvelis-cli"

[tasks.build-cli]
description = "Build the synvelis-cli binary without GUI deps: cargo build -p synvelis-cli --locked"
run = "cargo build --locked -p synvelis-cli"

[tasks.check-full]
description = "Workspace-wide check; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo check --workspace --all-targets --locked{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %}'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.lint-full]
description = "Workspace-wide lint; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo clippy --workspace --all-targets --locked{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %} -- -D warnings'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.test-full]
description = "Workspace-wide test; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo test --workspace --locked{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %}'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.build-full]
description = "Workspace-wide build; dev profile locally, CI Cargo profile when MISE_ENV=ci"
run = 'cargo build --workspace --locked{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %} --profile ci{% endif %}'
env = { CARGO_INCREMENTAL = '{% if env.MISE_ENV is defined and env.MISE_ENV == "ci" %}0{% else %}{{ env.CARGO_INCREMENTAL | default(value="1") }}{% endif %}' }

[tasks.verify-full]
description = "Standard workspace verification (current OS): format, check, lint, test"
run = [
  "mise run fmt-check",
  "mise run check-full",
  "mise run lint-full",
  "mise run test-full",
]

[tasks.gw10]
description = "Run the GW-10 gateway harness suites and emit the gate report"
run = [
  "cargo run -p synvelis-gateway --bin gw10_report -- --clean",
  "cargo test -p synvelis-gateway --test gw10_harness --test gw10_contract --test gw10_authorization --test gw10_project --test gw10_concurrency --test gw10_persistence --test gw10_mcp --test gw10_job --test gw10_system",
  "cargo test -p mcp-poc --test gw10_transport",
  "cargo run -p synvelis-gateway --bin gw10_report -- --strict",
]

[tasks.gw10-report]
description = "Aggregate target/gw10-evidence into the per-gate verdict report"
run = "cargo run -p synvelis-gateway --bin gw10_report"

# Issue #110 / SV-GUI-01: ui/ frontend lane. The Cargo.lock ruviform rev is
# the single source of truth — sync-ui-deps materializes the vendored
# ui/* packages from the local cargo checkout at that rev, and
# check-ruviform-rev verifies lock/vendor/manifest agree.

[tasks.sync-ui-deps]
description = "ruviform ui/*(TS)を Cargo.lock と同一 SHA で ui/vendor/ へ再生成"
run = "node tools/sync-ruviform-ui.mjs"

# Issue #151 / ruviform #330 整合: ui/package-lock.json への npm ci は
# install-ui task のみが所有する。sources(lockfile + manifest)と
# outputs(npm が install 時に必ず書く hidden lockfile)で mise の
# freshness check が働き、入力不変の再実行は skip される。CI lane は
# 前段で setup-ui を一度だけ実行し、後続の npm 消費 task は depends
# 経由で同じ node_modules を再利用する。
[tasks.install-ui]
description = "Install ui deps via npm ci from package-lock (skipped while lockfile/manifest and node_modules marker are unchanged)"
sources = ["ui/package-lock.json", "ui/package.json"]
outputs = ["ui/node_modules/.package-lock.json"]
run = "npm --prefix ui ci --no-audit --no-fund"

[tasks.setup-ui]
description = "ui/ npm deps の集約 install 入口(CI lane 前段で一度だけ実行; verify task は depends 経由で再利用)"
depends = ["install-ui"]

[tasks.check-ruviform-rev]
description = "ruviform Git 依存の resolved SHA 単一性 + UI vendor REV + frontend manifest 整合を検証"
run = "node tools/check-ruviform-rev.mjs"

[tasks.check-headless-deps]
description = "headless crate の依存木に GUI/GPU/WebView framework crate が無いことを検証"
run = "node tools/check-headless-deps.mjs"

[tasks.check-ui]
description = "ui/ frontend の型チェック(tsc --noEmit)+ vendor 同期照合"
depends = ["install-ui"]
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui run typecheck",
]

[tasks.test-ui]
description = "ui/ frontend の vitest スイート(happy-dom、実 SolidJS client render)"
depends = ["install-ui"]
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui test",
]

[tasks.build-ui]
description = "ui/ frontend を vite build し crates/synvelis-app/frontend/dist + manifest を生成"
depends = ["install-ui"]
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui run build",
]

# synvelis-app `webview` feature lane。既定 check/lint/test は headless
# (lib + Service op 層)のまま、実窓 host 依存ターゲットはここで分離検証する。

[tasks.check-app-webview]
description = "synvelis-app webview feature 型チェック(実窓 host ターゲット含む)"
run = "cargo check -p synvelis-app --features webview --all-targets"

[tasks.lint-app-webview]
description = "synvelis-app webview feature lint"
run = "cargo clippy -p synvelis-app --all-targets --features webview -- -D warnings"

[tasks.test-app-webview]
description = "synvelis-app webview feature テスト"
run = "cargo test -p synvelis-app --features webview"

# synvelis-app `native` feature lane (SV-GPUI-01)。GPUI backend を
# 引くため headless 既定 lane と分離する。build jobs はタスク制約に
# 合わせ 1–2 に固定。

[tasks.check-app-native]
description = "synvelis-app native feature 型チェック(GPUI driver 組立 bin 含む)"
run = "cargo check -p synvelis-app --features native --all-targets"

[tasks.lint-app-native]
description = "synvelis-app native feature lint"
run = "cargo clippy -p synvelis-app --all-targets --features native -- -D warnings"

[tasks.build-app-native]
description = "synvelis-app native feature bin ビルド(GPUI driver 実窓)"
run = "cargo build -p synvelis-app --features native --bin synvelis-native --locked"

[tasks.run-app-native]
description = "synvelis-native 実窓起動(GPUI;mount/close の手動・実機検証入口)"
depends = ["build-app-native"]
run = "cargo run -p synvelis-app --features native --bin synvelis-native --locked"

# synvelis-app `gpui-test` feature lane (SV-GUI-03 slice 5,
# synvelis#112 AC5)。Fake/GPUI parity の GPUI-simulated scenario
# lane — `native` feature を内包するため headless 既定 lane と
# 分離する。実 Window/実 OS 入力・pixel 証拠は対象外
# (ruviform#313/#314, synvelis#114)。

[tasks.check-app-gpui]
description = "synvelis-app gpui-test feature 型チェック(GPUI scenario lane 含む)"
run = "cargo check -p synvelis-app --features gpui-test --all-targets"

[tasks.lint-app-gpui]
description = "synvelis-app gpui-test feature lint"
run = "cargo clippy -p synvelis-app --all-targets --features gpui-test -- -D warnings"

[tasks.test-app-gpui]
description = "synvelis-app gpui-test feature テスト(GPUI-simulated scenario lane)"
run = "cargo test -p synvelis-app --features gpui-test"

# synvelis-app `uitest` feature lane (Issue #600 stage 1 slice 1,
# ruviform#313/#314 RF-GT-03/04)。`rvf.uitest.v1` 外部制御 seam —
# `native` feature を内包するため headless 既定 lane と分離する。
# 制御ポート自体は実行時 `RVF_TEST_*` opt-in で、feature 有効
# ビルドでも既定は無効 (serve_from_env の Off 解決)。

[tasks.check-app-uitest]
description = "synvelis-app uitest feature 型チェック(rvf.uitest.v1 seam 含む)"
run = "cargo check -p synvelis-app --features uitest --all-targets"

[tasks.lint-app-uitest]
description = "synvelis-app uitest feature lint"
run = "cargo clippy -p synvelis-app --all-targets --features uitest -- -D warnings"

[tasks.test-app-uitest]
description = "synvelis-app uitest feature テスト(headless rvf.uitest.v1 seam)"
run = "cargo test -p synvelis-app --features uitest"

[tasks.build-app-uitest]
description = "synvelis-app uitest feature bin ビルド(rvf.uitest.v1 seam 付き実窓)"
run = "cargo build -p synvelis-app --features uitest --bin synvelis-native --locked"

# Issue #600 stage 2: `syn-ctl` ctl lane (verify-synvelis の ctl 入口)。
# manual/opt-in lane — CI-required gate ではない。dry-run leg は環境非依存、
# live doctor leg は interactive desktop session 前提の gate で、非対話環境では
# verdict が not_run/fail のまま evidence JSON に残り lane も失敗する
# (fake-pass にしない設計)。
[tasks.test-app-uitest-ctl]
description = "syn-ctl lane: uitest bins build → doctor/drive --dry-run plans → live doctor JSON + TCP doctor JSON (manual/opt-in, interactive gate; not CI-required)"
run = [
  "cargo build -p synvelis-app --features uitest --bin synvelis-native --bin syn-ctl --locked",
  "cargo run -p synvelis-app --features uitest --bin syn-ctl --locked -- doctor --dry-run",
  "cargo run -p synvelis-app --features uitest --bin syn-ctl --locked -- drive --dry-run",
  "cargo run -p synvelis-app --features uitest --bin syn-ctl --locked -- drive --op syn.view.list --params \"{}\" --dry-run",
  "cargo run -p synvelis-app --features uitest --bin syn-ctl --locked -- doctor --out evidence/sv600/syn-ctl-doctor.json",
  "cargo run -p synvelis-app --features uitest --bin syn-ctl --locked -- doctor --transport tcp --out evidence/sv600/syn-ctl-doctor-tcp.json",
]

[tasks.dev-ui]
description = "開発ループ: ui/ を build して synvelis app を debug 起動(assets は live FS 読み)"
depends = ["install-ui"]
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui run build",
  "cargo run -p synvelis-app --features webview --bin synvelis",
]

[tasks.build-app]
description = "本番 lane: ui/ build → synvelis-app release build(frontend dist 埋め込み)"
depends = ["install-ui"]
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui run build",
  "cargo build -p synvelis-app --features webview --release --locked",
]

[tasks.test-msrv]
description = "Compile and test under the declared MSRV toolchain"
run = "mise exec rust@1.89.0 -- cargo test --workspace --locked"

# Issue #601 D-layer formal verification slice 1: journal wire codec
# proptest suites（synvelis-gateway + synvelis-recording の
# tests/formal_journal.rs）。native lane — 常時実行可能な入口。
[tasks.test-formal]
description = "Issue #601 D-layer journal wire codec property suites (proptest): cargo test --test formal_journal for synvelis-gateway + synvelis-recording"
run = "cargo test --locked -p synvelis-gateway -p synvelis-recording --test formal_journal"

# test-formal-kani は同 harness に同梱した #[cfg(kani)] bounded proof
# を検証する手動/opt-in lane（CI-required gate ではない）。
# tools/run-formal-kani.mjs が native cargo kani → WSL2 distro の順で
# 環境検出し、WSL 側は WSL native FS の CARGO_TARGET_DIR を使う
# （/mnt 上の build は遅い・Windows 側 target dir は不変）。
# 実行不能環境は verdict `not_run` + `environment_blocked` で exit 0
# （fake pass しない）、実 verification 失敗のみ exit 1。
[tasks.test-formal-kani]
description = "Issue #601 D-layer Kani bounded-proof lane (manual/opt-in — NOT a CI-required gate): env-detect (native cargo kani → WSL2 distro) via tools/run-formal-kani.mjs; honest not_run + exit 0 when no environment exists; exit 1 only on a real verification failure"
run = "node tools/run-formal-kani.mjs"

# Issue #602 E層 frozen benchmark lane（slice 1）: crates/synvelis-render/
# benches/frozen_render.rs の two-arm ハーネスを実行する opt-in lane。
# Arm K: 凍結 naive mixer vs 本番 HeadlessDriver の in-process A/B 計測、
# Arm P: 実 export() パイプライン E2E。gate は benches/frozen/
# baseline.sv602.json の pinned ratio/fingerprint と照合（fail-closed:
# baseline 欠落・未 promote・不整合は gate fail）。
# 既定は real run（evidence/sv602/decision.tsv に追記）。
# 引数はそのままハーネスに転送される: セルフィルタ `mix/4x256`、
# smoke `--test`、回帰注入 `--selftest`、`--write-baseline <path>`、
# `--baseline <path>`、`--help`。
[tasks.bench-frozen]
description = "Issue #602 E層 frozen 2-arm bench (opt-in): naive mixer vs HeadlessDriver in-process A/B + export() E2E + pinned ratio/fingerprint gate (fail-closed). 例: mise run bench-frozen -- --test / -- --selftest / -- mix/4x256"
run = "cargo bench --locked -p synvelis-render --bench frozen_render --"
