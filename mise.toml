[settings]
minimum_release_age = "7d"
lockfile = true

[env]
UV_EXCLUDE_NEWER = "1 week"

# Infrastructure tools only; add a project language toolchain as needed.
[tools]
actionlint = "1.7.12"
uv = "0.13.4"
prek = "0.5.5"
git-lfs = "3.8.0"
"github:microsoft/apm" = "0.33.0"
"pipx:serena-agent" = "1.7.0"
rust = { version = "1.99.0", components = ["rustfmt", "clippy"] }
node = "26.12.1"

[tasks.setup]
description = "Install APM dependencies, prek hooks and repository-local Git LFS"
run = [
  "apm install",
  "prek install",
  "git lfs install --local",
]

[tasks.fmt]
description = "Format all Rust sources"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting without rewriting"
run = "cargo fmt --all -- --check"

[tasks.check]
description = "Type-check the workspace (dev profile)"
run = "cargo check --workspace --all-targets"

[tasks.lint]
description = "Clippy with warnings denied (dev profile)"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run all workspace tests against the locked dependency graph"
run = "cargo test --workspace --locked"

[tasks.test-rt]
description = "Run the rt_ contract tests (RT no-alloc/no-block) against the locked dependency graph"
run = "cargo test --workspace --locked rt_"

# RCD-01 opt-in 実機 lane（CI 対象外・hardware 依存）。
# real-device feature で ruviform-audio-device/cpal を有効化し、
# tests/real_input.rs の #[ignore] test のみを実行する。
# device 不在環境では test 内の loud SKIP で終了する。
[tasks.test-recording-real-input]
description = "Run the opt-in real audio device lane for synvelis-recording (requires hardware; not in CI)"
run = "cargo test -p synvelis-recording --locked --features real-device --test real_input -- --ignored --test-threads=1"

# real-device feature 有効時の compile/lint を headless で検証する
# 補助 lane（cpal/OS audio 依存の build を要求するため opt-in）。
[tasks.lint-recording-real-input]
description = "Clippy for synvelis-recording with the real-device feature enabled (opt-in; not in CI)"
run = "cargo clippy -p synvelis-recording --all-targets --locked --features real-device -- -D warnings"

[tasks.lint-actions]
description = "Lint GitHub Actions workflow files with actionlint"
run = "actionlint"

# Issue #166 stage 1: Full CI 化。変更影響分類・選択実行は撤去し、全 lane
# を毎回実行する。jobs API 実結果の fail-closed 照合は tools/ci-summary.mjs
# が単一の authoritative 実装として所有する(pr=evidence 互換 gate、
# full=ci-summary — mode は CI_SUMMARY_MODE で渡す)。
[tasks.ci-summary-gate]
description = "run 内の全 lane leg を fail-closed 照合する CI 集約 gate (CI_SUMMARY_MODE=pr|full)"
run = "node tools/ci-summary.mjs gate"

[tasks.test-ci-summary]
description = "ci-summary gate の node:test スイート"
run = "node --test tools/ci-summary.test.mjs"

# Issue #167: consumer 側 reconcile 入口契約(共有 pin 単一性・mode 分離・
# guard・入口 trigger・既存入口不変)を静的に pin する。
[tasks.test-ci-tracker-entry]
description = "ci-issue-tracker reconcile 入口の consumer 契約 node:test スイート"
run = "node --test tools/ci-issue-tracker-reconcile.test.mjs"

[tasks.build]
description = "Build the workspace (dev profile)"
run = "cargo build --workspace --locked"

[tasks.gw10]
description = "Run the GW-10 gateway harness suites and emit the gate report"
run = [
  "cargo run -p synvelis-gateway --bin gw10_report -- --clean",
  "cargo test -p synvelis-gateway --test gw10_harness --test gw10_contract --test gw10_authorization --test gw10_project --test gw10_concurrency --test gw10_persistence --test gw10_mcp --test gw10_job --test gw10_system",
  "cargo test -p mcp-poc --test gw10_transport",
  "cargo run -p synvelis-gateway --bin gw10_report -- --strict",
]

[tasks.gw10-report]
description = "Aggregate target/gw10-evidence into the per-gate verdict report"
run = "cargo run -p synvelis-gateway --bin gw10_report"

# Issue #110 / SV-GUI-01: ui/ frontend lane. The Cargo.lock ruviform rev is
# the single source of truth — sync-ui-deps materializes the vendored
# ui/* packages from the local cargo checkout at that rev, and
# check-ruviform-rev verifies lock/vendor/manifest agree.

[tasks.sync-ui-deps]
description = "ruviform ui/*(TS)を Cargo.lock と同一 SHA で ui/vendor/ へ再生成"
run = "node tools/sync-ruviform-ui.mjs"

# Issue #151 / ruviform #330 整合: ui/package-lock.json への npm ci は
# install-ui task のみが所有する。sources(lockfile + manifest)と
# outputs(npm が install 時に必ず書く hidden lockfile)で mise の
# freshness check が働き、入力不変の再実行は skip される。CI lane は
# 前段で setup-ui を一度だけ実行し、後続の npm 消費 task は depends
# 経由で同じ node_modules を再利用する。
[tasks.install-ui]
description = "Install ui deps via npm ci from package-lock (skipped while lockfile/manifest and node_modules marker are unchanged)"
sources = ["ui/package-lock.json", "ui/package.json"]
outputs = ["ui/node_modules/.package-lock.json"]
run = "npm --prefix ui ci --no-audit --no-fund"

[tasks.setup-ui]
description = "ui/ npm deps の集約 install 入口(CI lane 前段で一度だけ実行; verify task は depends 経由で再利用)"
depends = ["install-ui"]

[tasks.check-ruviform-rev]
description = "ruviform Git 依存の resolved SHA 単一性 + UI vendor REV + frontend manifest 整合を検証"
run = "node tools/check-ruviform-rev.mjs"

[tasks.check-headless-deps]
description = "headless crate の依存木に GUI/GPU/WebView framework crate が無いことを検証"
run = "node tools/check-headless-deps.mjs"

[tasks.check-ui]
description = "ui/ frontend の型チェック(tsc --noEmit)+ vendor 同期照合"
depends = ["install-ui"]
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui run typecheck",
]

[tasks.test-ui]
description = "ui/ frontend の vitest スイート(happy-dom、実 SolidJS client render)"
depends = ["install-ui"]
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui test",
]

[tasks.build-ui]
description = "ui/ frontend を vite build し crates/synvelis-app/frontend/dist + manifest を生成"
depends = ["install-ui"]
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui run build",
]

# synvelis-app `webview` feature lane。既定 check/lint/test は headless
# (lib + Service op 層)のまま、実窓 host 依存ターゲットはここで分離検証する。

[tasks.check-app-webview]
description = "synvelis-app webview feature 型チェック(実窓 host ターゲット含む)"
run = "cargo check -p synvelis-app --features webview --all-targets"

[tasks.lint-app-webview]
description = "synvelis-app webview feature lint"
run = "cargo clippy -p synvelis-app --all-targets --features webview -- -D warnings"

[tasks.test-app-webview]
description = "synvelis-app webview feature テスト"
run = "cargo test -p synvelis-app --features webview"

# synvelis-app `native` feature lane (SV-GPUI-01)。GPUI backend を
# 引くため headless 既定 lane と分離する。build jobs はタスク制約に
# 合わせ 1–2 に固定。

[tasks.check-app-native]
description = "synvelis-app native feature 型チェック(GPUI driver 組立 bin 含む)"
run = "cargo check -p synvelis-app --features native --all-targets"

[tasks.lint-app-native]
description = "synvelis-app native feature lint"
run = "cargo clippy -p synvelis-app --all-targets --features native -- -D warnings"

[tasks.build-app-native]
description = "synvelis-app native feature bin ビルド(GPUI driver 実窓)"
run = "cargo build -p synvelis-app --features native --bin synvelis-native --locked"

[tasks.run-app-native]
description = "synvelis-native 実窓起動(GPUI;mount/close の手動・実機検証入口)"
depends = ["build-app-native"]
run = "cargo run -p synvelis-app --features native --bin synvelis-native --locked"

[tasks.dev-ui]
description = "開発ループ: ui/ を build して synvelis app を debug 起動(assets は live FS 読み)"
depends = ["install-ui"]
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui run build",
  "cargo run -p synvelis-app --features webview --bin synvelis",
]

[tasks.build-app]
description = "本番 lane: ui/ build → synvelis-app release build(frontend dist 埋め込み)"
depends = ["install-ui"]
run = [
  "node tools/sync-ruviform-ui.mjs --check",
  "npm --prefix ui run build",
  "cargo build -p synvelis-app --features webview --release --locked",
]

[tasks.test-msrv]
description = "Compile and test under the declared MSRV toolchain"
run = "mise exec rust@1.89.0 -- cargo test --workspace --locked"
