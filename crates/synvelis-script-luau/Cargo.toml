[package]
name = "synvelis-script-luau"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
synvelis-script = { path = "../synvelis-script" }
# Product Luau backend (synvelis#516): the RF-SCRIPT-00 neutral
# contract plus the ruviform `luau-mlua` runtime that owns the
# vendored Luau VM. mlua stays inside `ruviform-script-luau` — no
# synvelis crate depends on it directly; consumers go through the
# `synvelis_script::backend` port. Default-branch git deps matching
# the workspace ruviform convention (resolved rev is pinned in
# Cargo.lock); declared crate-locally because the root
# `[workspace.dependencies]` table is outside this slice's lease.
ruviform-script = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-script-luau = { git = "https://github.com/scarecrow173/ruviform.git" }

[dev-dependencies]
serde_json.workspace = true
