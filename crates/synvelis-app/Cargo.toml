[package]
name = "synvelis-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
synvelis-library = { path = "../synvelis-library" }
synvelis-project = { path = "../synvelis-project" }
synvelis-player = { path = "../synvelis-player" }
synvelis-recording = { path = "../synvelis-recording" }
synvelis-workspace = { path = "../synvelis-workspace" }
ruviform-audio.workspace = true
ruviform-audio-core.workspace = true
ruviform-audio-plugin-bridge.workspace = true
ruviform-media-core.workspace = true
ruviform-media-reader.workspace = true
ruviform-plugin-core.workspace = true
# SV176 (synvelis#176): the product PluginDock panel model drives the
# driver-neutral `editor_session` state machine (`PluginEditorSessions`
# + `EditorSessionOps` seam) — promoted from dev-dep now that product
# code uses it. The adapter itself is injected via `PluginEditorHost`;
# no OS/plugin binary is linked by this crate.
ruviform-plugin-host.workspace = true
ruviform-ui.workspace = true
ruviform-observability = { workspace = true, features = ["logging"] }
tracing.workspace = true
ruviform-ui-webview = { workspace = true, optional = true }
ruviform-ui-gpui = { workspace = true, optional = true }
ruviform-ui-test = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
synvelis-theme = { workspace = true, optional = true }

[dev-dependencies]
ruviform-ui-test.workspace = true
# synvelis#176 slice S1 — `tests/plugin_dock_probe.rs` runs the upstream
# `rf631.plugin-dock` HEADLESS_MATRIX via `ruviform-plugin-dock-test`,
# drives the product `PluginDock` through `InProcessHost` + the real
# `Vst3Library`/`ClapLibrary` host bridges (`host` feature), and loads
# the ruviform#630 test-plugin cdylibs — the dev-dep edge builds them
# into `target/<profile>/deps/` where `resolve_artifact` finds them.
ruviform-plugin-dock-test.workspace = true
ruviform-plugin-vst3 = { workspace = true, features = ["host"] }
ruviform-plugin-clap = { workspace = true, features = ["host"] }
ruviform-plugin-test-vst3.workspace = true
ruviform-plugin-test-clap.workspace = true

[features]
webview = [
  "dep:ruviform-ui-webview",
  "ruviform-ui-webview/webview",
  "dep:rust-embed",
]
# SV-GPUI-01: GPUI standard-driver assembly — the only place `gpui` and
# OS-window types enter the tree. Non-default so `cargo check
# --workspace` stays headless, same pattern as `webview`.
native = [
  "dep:ruviform-ui-gpui",
  "ruviform-ui-gpui/gpui",
  "dep:synvelis-theme",
]
# SV-GUI-03 slice 5 (synvelis#112 AC5, ruviform#464): the
# GPUI-simulated scenario lane — `GpuiGuiTest`/`GpuiObserver` running
# the shared driver-neutral scenarios. Builds on `native` (the
# product's GPUI feature name); non-default so the headless lanes
# stay gpui-free.
gpui-test = ["native", "ruviform-ui-gpui/gpui-test"]
# Issue #600 stage 1 slice 1 (ruviform#313/#314, RF-GT-03/04): the
# `rvf.uitest.v1` external-control seam — `WindowedIo` over the real
# GPUI loop plus the app-side `TestApp` wiring, so external fixtures
# drive the same `syn.*` op surface as normal IPC. Builds on
# `native`; the port is also runtime-gated (`RVF_TEST_*`), so even a
# `uitest` build stays inert without explicit opt-in.
uitest = ["native", "ruviform-ui-gpui/uitest", "dep:ruviform-ui-test"]
# synvelis#114 SV-GUI-05: opt-in real OS scenario lane. The feature is
# non-default, remains separate from `gpui-test` and `uitest`, and enables only
# the ruviform `RealOsGuiTest` contract; interactive desktop availability is a
# runtime preflight recorded as NotRun when absent.
real-os-scenario = ["native", "ruviform-ui-gpui/real-scenario"]

[[bin]]
name = "synvelis"
path = "src/bin/synvelis.rs"
required-features = ["webview"]

[[bin]]
name = "synvelis-native"
path = "src/bin/synvelis-native.rs"
required-features = ["native"]

# Issue #600 stage 2: the verification control CLI — a thin
# `rvf.uitest.v1` TestDriver client (doctor + drive). Rides the
# `uitest` feature boundary so it stays out of default/product builds
# (`ruviform-ui-test` is a dev/test crate — isolation by DAG).
[[bin]]
name = "syn-ctl"
path = "src/bin/syn_ctl.rs"
required-features = ["uitest"]

[[test]]
name = "sv_os_real"
path = "tests/sv_os_real.rs"
required-features = ["real-os-scenario"]
