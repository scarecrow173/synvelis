[package]
name = "synvelis-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
synvelis-project = { path = "../synvelis-project" }
synvelis-workspace = { path = "../synvelis-workspace" }
ruviform-ui.workspace = true
ruviform-observability.workspace = true
ruviform-ui-webview = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }

[features]
webview = [
  "dep:ruviform-ui-webview",
  "ruviform-ui-webview/webview",
  "dep:rust-embed",
]

[[bin]]
name = "synvelis"
path = "src/bin/synvelis.rs"
required-features = ["webview"]
