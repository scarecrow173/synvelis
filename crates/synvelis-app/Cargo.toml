[package]
name = "synvelis-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
synvelis-library = { path = "../synvelis-library" }
synvelis-project = { path = "../synvelis-project" }
synvelis-player = { path = "../synvelis-player" }
synvelis-recording = { path = "../synvelis-recording" }
synvelis-workspace = { path = "../synvelis-workspace" }
ruviform-audio.workspace = true
ruviform-audio-core.workspace = true
ruviform-audio-plugin-bridge.workspace = true
ruviform-media-core.workspace = true
ruviform-media-reader.workspace = true
ruviform-plugin-core.workspace = true
ruviform-ui.workspace = true
ruviform-observability = { workspace = true, features = ["logging"] }
tracing.workspace = true
ruviform-ui-webview = { workspace = true, optional = true }
ruviform-ui-gpui = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
synvelis-theme = { workspace = true, optional = true }

[dev-dependencies]
ruviform-ui-test.workspace = true
ruviform-plugin-host.workspace = true

[features]
webview = [
  "dep:ruviform-ui-webview",
  "ruviform-ui-webview/webview",
  "dep:rust-embed",
]
# SV-GPUI-01: GPUI standard-driver assembly — the only place `gpui` and
# OS-window types enter the tree. Non-default so `cargo check
# --workspace` stays headless, same pattern as `webview`.
native = [
  "dep:ruviform-ui-gpui",
  "ruviform-ui-gpui/gpui",
  "dep:synvelis-theme",
]
# SV-GUI-03 slice 5 (synvelis#112 AC5, ruviform#464): the
# GPUI-simulated scenario lane — `GpuiGuiTest`/`GpuiObserver` running
# the shared driver-neutral scenarios. Builds on `native` (the
# product's GPUI feature name); non-default so the headless lanes
# stay gpui-free.
gpui-test = ["native", "ruviform-ui-gpui/gpui-test"]

[[bin]]
name = "synvelis"
path = "src/bin/synvelis.rs"
required-features = ["webview"]

[[bin]]
name = "synvelis-native"
path = "src/bin/synvelis-native.rs"
required-features = ["native"]
