[package]
name = "synvelis-recording"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
synvelis-project = { path = "../synvelis-project" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ruviform-io-file.workspace = true
ruviform-rt.workspace = true
ruviform-audio-core.workspace = true
ruviform-media-core.workspace = true

[features]
# opt-in 実機 lane（`tests/real_input.rs` の `#[ignore]` test と
# `src/real_input.rs` の host 部分を有効化）。cpal/OS audio 依存を
# 既定の依存グラフへ入れないため optional dep として分離する
# （synvelis-app の webview/native feature と同じ方針）。
real-device = ["dep:ruviform-audio-device"]

[dependencies.ruviform-audio-device]
workspace = true
optional = true

[dev-dependencies]
stats_alloc = "0.1.10"
ruviform-audio-test.workspace = true
# - proptest: Issue #601 D層 formal verification slice 1 — staging
#   journal wire codec（`encode_record`/`replay_journal`/
#   `JournalAppender` + `crc32`/`Crc32`/`digest_fold` + session SM）の
#   property suite（tests/formal_journal.rs）に使用する生成入力検査器。
#   dev-dep のみで本番依存グラフへ波及しない。MIT OR Apache-2.0・
#   pure Rust。MSRV 1.89 適合。
proptest = "1"
