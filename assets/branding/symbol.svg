<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Synvelis symbol</title><desc id="desc">Branching and converging signal paths representing the Synvelis DAW.</desc>
<defs><linearGradient id="synvelis-flow" x1="11" y1="34" x2="146" y2="119" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#057C91"/><stop offset="1" stop-color="#6375C8"/></linearGradient></defs>
<!-- Secondary, dotted structural connections -->
<g fill="none" stroke="#6A93B1" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2.5 7" opacity=".5"><path d="M50 44 53 112"/><path d="M119 23 120 129"/></g>
<!-- Two branching signal paths converge at the shared node -->
<g fill="none" stroke="url(#synvelis-flow)" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 77 50 44 82 78 119 23 145 46"/><path d="M17 77 53 112 82 78 120 129 145 107"/></g>
<g fill="#0b829a"><circle cx="17" cy="77" r="6.1"/><circle cx="50" cy="44" r="5.6"/><circle cx="53" cy="112" r="5.6"/></g>
<g fill="#627fd3"><circle cx="119" cy="23" r="5.7"/><circle cx="120" cy="129" r="5.7"/><circle cx="145" cy="46" r="5.5"/><circle cx="145" cy="107" r="5.5"/></g>
<circle cx="82" cy="78" r="7.6" fill="#627fd3"/><circle cx="82" cy="78" r="3" fill="#172431" opacity=".88"/>
</svg>
