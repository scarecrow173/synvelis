[workspace]
resolver = "2"
members = [
  "crates/synvelis-project",
  "crates/synvelis-recording",
  "crates/recording-poc",
  "crates/synvelis-player",
  "crates/synvelis-render",
  "crates/synvelis-workspace",
  "crates/synvelis-gateway",
  "crates/mcp-poc",
  "crates/synvelis-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
incremental = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
ruviform-media-core = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-media-io = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-media-reader = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-io-symphonia = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-graph = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-audio = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-audio-core = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-rt = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-io-wav = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-exec = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-ui = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-viz = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-plugin-core = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-plugin-host = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-audio-plugin-bridge = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-ui-webview = { git = "https://github.com/scarecrow173/ruviform.git" }
rust-embed = "8"
