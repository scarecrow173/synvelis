ruviform-graph = { git = "https://github.com/scarecrow173/ruviform.git", branch = "feature/gui-driver-neutral-design-contract" }
ruviform-audio = { git = "https://github.com/scarecrow173/ruviform.git", branch = "feature/gui-driver-neutral-design-contract" }
