[workspace]
resolver = "2"
members = [
  "crates/synvelis-theme",
  "crates/synvelis-project",
  "crates/synvelis-recording",
  "crates/recording-poc",
  "crates/synvelis-player",
  "crates/synvelis-render",
  "crates/synvelis-workspace",
  "crates/synvelis-gateway",
  "crates/mcp-poc",
  "crates/synvelis-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
incremental = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
# TEMPORARY (SV177/RF385): all ruviform deps track the
# `feature/gui-driver-neutral-design-contract` candidate branch so the
# `ruviform-ui-theme` DTCG interpreter (ruviform #385) is consumable and
# the single-resolved-SHA invariant (tools/check-ruviform-rev.mjs) holds.
# Removal condition: drop every `branch` key once the candidate lands on
# ruviform's default branch. See evidence/reports/sv177-rf385-adapter.md.
ruviform-media-core = { git = "https://github.com/scarecrow173/ruviform.git", branch = "feature/gui-driver-neutral-design-contract" }
ruviform-media-io = { git = "https://github.com/scarecrow173/ruviform.git", branch = "feature/gui-driver-neutral-design-contract" }
