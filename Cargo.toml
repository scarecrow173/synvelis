[workspace]
resolver = "2"
members = [
  "crates/synvelis-theme",
  "crates/synvelis-project",
  "crates/synvelis-library",
  "crates/synvelis-recording",
  "crates/recording-poc",
  "crates/synvelis-player",
  "crates/synvelis-render",
  "crates/synvelis-workspace",
  "crates/synvelis-gateway",
  "crates/synvelis-automation",
  "crates/synvelis-script",
  "crates/synvelis-script-luau",
  "crates/synvelis-cli",
  "crates/mcp-poc",
  "crates/synvelis-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# tests/ 配下の `#[cfg(kani)]` proof harness（Issue #601 formal
# verification）を check-cfg で許容する。`cargo kani` 実行時にのみ
# 有効化され、通常ビルドでは cfg 除外される。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
incremental = true

# CI: use a dedicated profile so CI artifacts do not invalidate local dev builds.
# Match the shared Ruviform / AudioLens profile contract.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false

# External dependencies do not need debug symbols in CI artifacts.
[profile.ci.package."*"]
debug = "none"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
keyring = "4.2"
ruviform-io-file = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-media-core = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-media-io = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-media-reader = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-io-symphonia = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-graph = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-audio = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-audio-core = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-audio-device = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-rt = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-io-wav = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-exec = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-ui = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-ui-theme = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-viz = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-plugin-core = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-plugin-host = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-audio-plugin-bridge = { git = "https://github.com/scarecrow173/ruviform.git" }
# synvelis#176 (SV-GPUI-02) slice S1 — test-only real-ABI plugin-dock
# probe (dev-deps of synvelis-app): upstream `rf631.plugin-dock`
# HEADLESS_MATRIX driver, the host-side format adapters it and the
# product-level legs load (`host` feature is specified crate-side),
# and the ruviform#630 test-plugin cdylib crates whose dev-dep edge
# places the real binaries next to the test executables.
ruviform-plugin-dock-test = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-plugin-vst3 = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-plugin-clap = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-plugin-test-vst3 = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-plugin-test-clap = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-ui-webview = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-ui-gpui = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-ui-test = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-audio-test = { git = "https://github.com/scarecrow173/ruviform.git" }
ruviform-observability = { git = "https://github.com/scarecrow173/ruviform.git" }
synvelis-theme = { path = "crates/synvelis-theme" }
rust-embed = "8"
tracing = "0.1"
