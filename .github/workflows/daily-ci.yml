name: daily-ci

on:
  schedule:
    - cron: "29 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "判定のみ実行し ci.yml を dispatch しない"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-decision
  cancel-in-progress: false

env:
  MISE_ENABLE_TOOLS: node

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout shared CI implementation
        uses: actions/checkout@v7.0.1
        with:
          repository: scarecrow173/ruviform
          ref: 669d6d88892dd61d166035aa8a3331def0311957
          path: .ci-shared/ruviform
          ssh-key: ${{ secrets.CROSS_REPO_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v5.2.0
        with:
          install: false

      - name: Restore node toolchain from mise.lock
        run: |
          mise trust
          mise install --locked node

      - name: Record shared CI implementation revision
        run: |
          echo "Shared CI revision: $(git -C .ci-shared/ruviform rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Self-test shared daily evaluator
        run: mise exec -- node --test .ci-shared/ruviform/ci/daily/

      - name: Evaluate main verification state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          DAILY_TARGET_WORKFLOW: ci.yml
          DAILY_MAIN_REF: main
          DAILY_MAX_AUTO_DISPATCHES: "2"
        run: mise exec -- node .ci-shared/ruviform/ci/daily/decide.mjs --report daily-ci-report.json

      - name: Upload daily-ci report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ci-report-attempt-${{ github.run_attempt }}
          path: daily-ci-report.json
          if-no-files-found: warn
